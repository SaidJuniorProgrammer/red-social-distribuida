# ----------------------------------------
# Configuración de Neo4j (Grafo Social)
# ----------------------------------------
quarkus.neo4j.uri=bolt://localhost:7687
quarkus.neo4j.authentication.username=neo4j
quarkus.neo4j.authentication.password=password123

# ----------------------------------------
# Configuración de S3 (MinIO para Archivos)
# ----------------------------------------
quarkus.s3.endpoint-override=http://localhost:9090
quarkus.s3.aws.region=us-east-1
quarkus.s3.aws.credentials.type=static
quarkus.s3.aws.credentials.static-provider.access-key-id=admin
quarkus.s3.aws.credentials.static-provider.secret-access-key=1234
quarkus.s3.path-style-access=true

# ----------------------------------------
# Acceso del frontend durante el desarrollo
# ----------------------------------------
quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=http://localhost:5173,http://127.0.0.1:5173
%dev.quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
%dev.quarkus.http.cors.headers=Accept,Authorization,Content-Type

# Permite una imagen de hasta 10 MB junto con el formulario multipart.
quarkus.http.limits.max-body-size=11M

# ----------------------------------------
# Autenticación del chat en tiempo real
# ----------------------------------------
mp.jwt.verify.issuer=https://redsocial.com/issuer
quarkus.websockets-next.server.supported-subprotocols=bearer-token-carrier
quarkus.websockets-next.server.propagate-subprotocol-headers=true

# En producción, define ambas variables para mantener la misma identidad Web Push entre reinicios.
webpush.vapid.public-key=${VAPID_PUBLIC_KEY:}
webpush.vapid.private-key=${VAPID_PRIVATE_KEY:}
webpush.vapid.subject=${VAPID_SUBJECT:mailto:admin@pachyweb.local}
webpush.allowed-hosts=${WEBPUSH_ALLOWED_HOSTS:fcm.googleapis.com,updates.push.services.mozilla.com,push.services.mozilla.com,web.push.apple.com,*.notify.windows.com}
webpush.delivery-timeout-seconds=${WEBPUSH_DELIVERY_TIMEOUT_SECONDS:10}

# --- Configuración CORS para permitir conexión del Frontend ---
quarkus.http.cors=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with
quarkus.http.cors.methods=GET, POST, PUT, DELETE, OPTIONS, PATCH
