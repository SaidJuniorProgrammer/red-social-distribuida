# Credenciales del proyecto
sonar.projectKey=SaidJuniorProgrammer_red-social-distribuida
sonar.organization=saidjuniorprogrammer

# Código fuente del frontend y backend
sonar.sources=frontend/src,backend/src/main/java
sonar.java.binaries=backend/target/classes

# Pruebas de ambos proyectos
sonar.tests=frontend/tests,backend/src/test/java

# Reportes de cobertura generados antes del análisis
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.coverage.jacoco.xmlReportPaths=backend/target/jacoco-report/jacoco.xml

# Archivos de configuración sin lógica de negocio
sonar.coverage.exclusions=frontend/eslint.config.js,frontend/vite.config.js

# Exclusiones de carpetas que no requieren análisis de calidad
sonar.exclusions=**/node_modules/**,**/*.spec.ts,**/target/**,frontend/public/**
