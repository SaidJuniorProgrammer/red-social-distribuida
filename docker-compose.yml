name: red-social-distribuida

services:
  # Base de Datos de Grafos
  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
    volumes:
      - neo4j_data:/data

  # Object Storage (S3 Compatible) - Adobe S3Mock (100% Gratuito y Libre)
  s3-storage:
    image: adobe/s3mock:latest
    ports:
      - "9090:9090" # Puerto HTTP para que se conecte Quarkus
    environment:
      - initialBuckets=red-social-bucket # ¡Crea el bucket por ti!

volumes:
  neo4j_data: